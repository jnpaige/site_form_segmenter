# ---------------------------------------------------------------------------
# config.yaml — site_form_segmenter
# ---------------------------------------------------------------------------
# Usage:
#   python segmenter.py                     # all sites, mode from this file
#   python segmenter.py --trinomial 16WN385 # single site
#   python segmenter.py --mode text         # override mode
#   python segmenter.py --mode vision       # override mode
#   python segmenter.py --force             # re-run existing outputs
# ---------------------------------------------------------------------------

input_dir:         'C:\Users\jpaige\Desktop\local_repositories\2024_forms_chunk_1_surya_docling_5_15_2026'
output_dir:        'C:\Users\jpaige\Desktop\local_repositories\2024_forms_chunk_1_segmented_5_15_2026'   # defaults to ./runs if omitted
trinomial_pattern: '(\d{2}[A-Z]{2}\d+)'

# 'vision' uses llama3.2-vision for pass 1 (investigation boundaries via PDF images),
# then text_model for passes 2-4.
# 'text'   uses text_model for all 4 passes (OCR text only, no PDF rendering).
mode: 'text'

page_truncation_chars: 3000   # chars of OCR text shown per page in text passes
pdf_thumb_width:       240   # width in pixels of each page thumbnail in the contact sheet grid;
                             # 3 columns × 240px = 720px wide total image sent to the vision model


# model options. 'qwen2.5:14b', 'llama3.1:8b'  
base_url:        'http://localhost:11434'
vision_model:    'llama3.2-vision:11b'   # used for pass 1 in vision mode
text_model:      'qwen2.5:14b'           # used for passes 2-4 (and all passes in text mode)
temperature:     0.2
timeout_seconds: 1800
