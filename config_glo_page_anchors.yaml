# ---------------------------------------------------------------------------
# config_glo_page_anchors.yaml — segment_glo_page_anchors.py
# GLO survey field notes — per-page Township/Range EVIDENCE MAP read from
# page imagery with a vision model.
#
# Reads the two anchors the text pipeline loses: the archivist's photographic
# title card (white-on-black, recovered by Surya on only ~9% of corpus pages)
# and the volume page number in the top margin (not recoverable at all, since
# 80% of GLO pages come back with no Docling layout structure). Plus the
# front-matter index table, read from its image rather than its shredded OCR.
#
# Output is an evidence map keyed by 0-indexed PDF page, NOT a segments.json —
# see the script's module docstring for why those are kept separate.
#
# Usage:
#   uv run python segment_glo_page_anchors.py --config config_glo_page_anchors.yaml
#   uv run python segment_glo_page_anchors.py --config config_glo_page_anchors.yaml \
#       --report "507_00615__2N1W+3N1W+4N2W+4N3W__NO5_SUP_SWD_MCCRUMMEN"
#   uv run python segment_glo_page_anchors.py --config config_glo_page_anchors.yaml \
#       --survey --limit 30
# ---------------------------------------------------------------------------

# ORIGINAL source PDFs, not pdf_ocr's <stem>_ocr.pdf outputs: the latter carry
# a "=== Page N ===" stamp top-right that lands inside the top-strip crop and
# reads as a volume page number. Page order is identical between the two.
pdf_dir:    'C:\Users\jpaige\Box\4. Research\LLM_GLO_map_notes\Glo_map_field_notes_evangeline'
output_dir: 'runs'

# qwen2.5vl:7b was hand-checked on six pages spanning all three volume
# families (card + stamped number, card + handwritten number, no card):
# 6/6 margin page numbers and 4/4 title cards correct, ~3s/page. It is small
# enough (6GB) to run alongside a Surya OCR job on a 24GB card. qwen3-vl:32b
# is available if accuracy on a hard volume needs a second opinion, but it
# will not co-reside with an OCR run.
model:           'qwen2.5vl:7b'
base_url:        'http://localhost:11434'
temperature:     0.0
num_ctx:         8192
timeout_seconds: 300

# Fraction of page HEIGHT kept in the top-strip crop. 0.18 was checked by eye
# against all three volume families: it clears the title card and both
# margin-number corners without pulling in the first line of body text.
strip_frac: 0.18

# Front-matter pages searched for the index table. Observed index pages in
# this corpus sit at PDF page 0-5.
index_scan_pages: 6

# Pages rendered per batch before being sent one at a time. Only affects peak
# memory, not the number of LLM calls.
render_batch: 25

# Pages sampled per volume in --survey mode.
survey_pages: 6

# Longest-edge pixel budget for the index-page render. Load-bearing, not a
# performance knob: at 1600 the model transcribed an index row's handwritten
# "N" as "S" (caught only because that page's printed title card contradicted
# it); at 2200 every checked row on 507_00615 was correct, and 3000 changed
# nothing further. One call per volume, so render it large.
index_max_dim: 2200

# OPTIONAL. pdf_ocr output directory for this corpus. When set, and when a
# volume was OCR'd with a pdf_ocr new enough to emit per-page `tables`
# (2026-09+), the index table is read a SECOND time from that table geometry
# and cross-checked against the vision read — free, deterministic, and a
# completely different mechanism, so the two corroborate each other.
#
# The reflowed md_text cannot substitute for this: it groups the index page
# by column (every township, then every range, then every page number),
# losing the row alignment that says which township goes with which page.
# The `tables` grid keeps it.
#
# Leave unset, or point at a pre-2026-09 corpus, and the cross-check is
# simply skipped.
ocr_dir: 'C:\Users\jpaige\Desktop\local_repositories\GLO_survey_notes_ocr\GLO_evang_ocr_2026_09_test'
